name: Telegram to Instagram Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"
      timezone: "Asia/Gaza"

concurrency:
  group: tg-ig-bridge-production
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    env:
      APP_ENV: production
      DEBUG: "false"
      LOG_LEVEL: INFO
      POSTGRES_HOST: ${{ secrets.POSTGRES_HOST }}
      POSTGRES_PORT: ${{ secrets.POSTGRES_PORT }}
      POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
      POSTGRES_SSL_MODE: require
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_DASHBOARD_ADMIN_IDS: ${{ secrets.TELEGRAM_DASHBOARD_ADMIN_IDS }}
      AI_API_KEY: ${{ secrets.GROQ_API_KEY }}
      AI_MODEL: ${{ secrets.GROQ_MODEL || 'llama-3.3-70b-versatile' }}
      AI_API_BASE_URL: https://api.groq.com/openai/v1
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
      INSTAGRAM_GRAPH_API_BASE_URL: https://graph.facebook.com/v23.0
      INSTAGRAM_MEDIA_BASE_URL: ${{ secrets.MEDIA_PUBLIC_BASE_URL }}
      INSTAGRAM_PUBLISH_MODE: AUTO
      MEDIA_S3_ENDPOINT_URL: ${{ secrets.MEDIA_S3_ENDPOINT_URL }}
      MEDIA_S3_REGION: ${{ secrets.MEDIA_S3_REGION }}
      MEDIA_S3_ACCESS_KEY_ID: ${{ secrets.MEDIA_S3_ACCESS_KEY_ID }}
      MEDIA_S3_SECRET_ACCESS_KEY: ${{ secrets.MEDIA_S3_SECRET_ACCESS_KEY }}
      MEDIA_S3_BUCKET_NAME: ${{ secrets.MEDIA_S3_BUCKET_NAME }}
      MEDIA_PUBLIC_BASE_URL: ${{ secrets.MEDIA_PUBLIC_BASE_URL }}
      MEDIA_STORAGE_BACKEND: s3
      MEDIA_STORAGE_DIR: /tmp/tg-ig-media
      DEFAULT_DAILY_POST_LIMIT: "1"
      DEFAULT_DAILY_REEL_LIMIT: "1"
      DEFAULT_DAILY_STORY_LIMIT: "10"
      STORY_COOLDOWN_HOURS: "24"
      MEDIA_RETENTION_DAYS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Database migrations
        run: alembic upgrade head
      - name: Run cycles for up to ~55 minutes
        run: python -m app.runtime.worker_timed
